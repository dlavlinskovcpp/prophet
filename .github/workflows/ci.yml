name: CI

on:
  push:
    branches:
      - main
      - master
      - initial-project
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-audit:
    name: Rust + zkTLS Audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          toolchain: 1.89.0
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run zkTLS guardrail audit
        run: bash scripts/check_zktls.sh

      - name: Rust format gate
        run: cargo fmt --all --check

      - name: Locked workspace tests
        run: cargo test --workspace --locked

      - name: Strict Clippy gate
        run: cargo clippy --workspace --all-targets -- -D warnings

  anchor-ts:
    name: Anchor TS Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANCHOR_WALLET: /home/runner/.config/solana/id.json
      ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
      ANCHOR_VERSION: 1.0.3
      SOLANA_VERSION: 3.1.10
      NODE_VERSION: 20.19.6
      YARN_VERSION: 1.22.22
      POETRY_VERSION: 1.8.5
      CI_ENV_DIR: /tmp/prophet-release-envs
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.6"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libssl-dev

      - name: Install Solana CLI
        run: |
          curl -fsSL -o /tmp/solana-install "https://release.anza.xyz/v${SOLANA_VERSION}/install"
          echo "dfd8afbff06d8c0302e11c2fbead5464d5c773097af97c772f3df8470677e130  /tmp/solana-install" | sha256sum -c -
          SOLANA_RELEASE="v${SOLANA_VERSION}" sh /tmp/solana-install
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          solana-test-validator --version
          test "$(solana --version | awk '{print $2}')" = "${SOLANA_VERSION}"
          test "$(solana-test-validator --version | awk '{print $2}')" = "${SOLANA_VERSION}"
        
      - name: Verify SBF Toolchain
        run: |
          cargo build-sbf --version
          cargo build-sbf --manifest-path programs/prophet/Cargo.toml --help >/dev/null

      - name: Install Anchor CLI
        run: |
          cargo install \
            --git https://github.com/solana-foundation/anchor \
            --rev "9bd4f2f41b0407545da1af7348b0419725ce3ce8" \
            anchor-cli \
            --locked \
            --force
          anchor --version
          test "$(anchor --version)" = "anchor-cli ${ANCHOR_VERSION}"

      - name: Verify pinned toolchain
        run: |
          anchor --version
          solana --version
          solana-test-validator --version
          rustc --version
          node --version
          yarn --version
          test "$(rustc --version | awk '{print $2}')" = "1.89.0"
          test "$(node --version)" = "v${NODE_VERSION}"

      - name: Clean build artifacts
        run: |
          cargo clean
          rm -rf target .anchor/test-ledger

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Run Attester Unit Tests
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests/test_signer_backend.py tests/test_signer_allowlist.py tests/test_remote_signer.py tests/test_signer_ops.py tests/test_vault_transit.py

      - name: Install SDK Python dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Validate untouched checked-in identity before ephemeral CI key sync
        run: |
          anchor build --ignore-keys
          python3 scripts/release.py validate-checked-in --idl target/idl/prophet.json
          python3 scripts/release.py plan --environment public-devnet --release-tag "checked-in-${GITHUB_SHA}" --output /tmp/public-devnet-checked-in-manifest.json >/dev/null
          python3 - <<'PY'
          import json
          manifest = json.load(open('/tmp/public-devnet-checked-in-manifest.json', encoding='utf-8'))
          expected = '3AUW4eLPigqyHmQNapcmv3JSYw6s8Aa5PPf87ayGT8kE'
          assert manifest['program']['program_id'] == expected
          assert manifest['authorization']['program_identity_policy'] == 'match-source'
          PY
          echo "CHECKED-IN CONFIG VALIDATION PASSED"

      - name: Create test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$ANCHOR_WALLET"
          solana config set --keypair "$ANCHOR_WALLET"

      - name: Sync Program ID to CI Program Keypair
        run: |
          mkdir -p target/deploy
          if [ ! -f target/deploy/prophet-keypair.json ]; then
            solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/prophet-keypair.json
          fi
          anchor keys sync -p prophet
          anchor keys list

      - name: Build Anchor program
        run: anchor build

      - name: Record RC4.7 program artifact provenance
        run: |
          rm -rf /tmp/rc47-program-provenance
          python3 scripts/build_rc47_release_provenance.py \
            --output-dir /tmp/rc47-program-provenance \
            --commit-sha "${GITHUB_SHA}" \
            --program target/deploy/prophet.so \
            --idl target/idl/prophet.json

      - name: Upload RC4.7 program provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc4.7-program-provenance-${{ github.sha }}
          path: /tmp/rc47-program-provenance

      - name: Run Anchor Tests
        run: |
          set -euo pipefail
          solana config set --url "$ANCHOR_PROVIDER_URL"

          mkdir -p .anchor/test-ledger
          VALIDATOR_LOG="/tmp/prophet-ci-validator.log"
          rm -f "${VALIDATOR_LOG}"

          solana-test-validator --reset \
            --ledger .anchor/test-ledger \
            --bind-address 127.0.0.1 \
            --rpc-port 8899 \
            --faucet-port 9901 \
            --gossip-port 10256 \
            --dynamic-port-range 10240-10300 \
            >"${VALIDATOR_LOG}" 2>&1 &

          VALIDATOR_PID=$!

          cleanup() {
            kill "${VALIDATOR_PID}" 2>/dev/null || true
            wait "${VALIDATOR_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 120); do
            if curl -s -X POST http://127.0.0.1:8899 \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' | grep -q '"result"'; then
              echo "Validator is ready"
              break
            fi

            if ! kill -0 "${VALIDATOR_PID}" 2>/dev/null; then
              echo "Validator exited before becoming ready"
              cat "${VALIDATOR_LOG}" || true
              exit 1
            fi

            if [ "${i}" -eq 120 ]; then
              echo "Validator did not become ready in time"
              cat "${VALIDATOR_LOG}" || true
              exit 1
            fi

            sleep 1
          done

          if ! anchor test --skip-build --skip-lint --skip-local-validator; then
            echo "Anchor tests failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          PROPHET_PROGRAM_ID_CI="$(anchor keys list | awk '/prophet:/ {print $2}')"
          echo "Using deployed Prophet program id: ${PROPHET_PROGRAM_ID_CI}"

          # Direct Attester settlement is intentionally disabled after the
          # secure-coordinator cutover. The Anchor suite above already exercises
          # actual on-chain threshold resolution; validate the production secure
          # application path rather than reviving the retired direct /resolve path.
          if ! (cd apps/oracle-attester && poetry run pytest -q \
            tests/test_resolution_mode_policy.py \
            tests/test_secure_settlement_service.py \
            tests/test_secure_settlement_application_flow.py); then
            echo "Secure settlement application flow failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          if ! (cd sdk/python && RUN_LOCALNET=1 RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="${PROPHET_PROGRAM_ID_CI}" PAYER_KEYPAIR_PATH="$ANCHOR_WALLET" ORACLE_KEYPAIR_PATH="$ANCHOR_WALLET" QUOTE_MINT="So11111111111111111111111111111111111111112" poetry run pytest -q tests/test_localnet_e2e.py); then
            echo "SDK localnet threshold e2e failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          (cd apps/oracle-attester && poetry run pytest -q ../../scripts/tests/test_p0c4_recovery_retirement.py)

      - name: Run Release Bundle Security Tests
        run: python3 scripts/tests/test_release_bundle_security.py -v

      - name: Run Secure Operated Topology Tests
        run: |
          python3 scripts/tests/test_secure_operated_renderer.py -v
          cd apps/oracle-attester
          poetry run pytest -q ../../scripts/tests/test_secure_release_topology.py

      - name: Prepare explicit ephemeral CI environments and generate audit bundles
        run: |
          set -euo pipefail
          BUNDLE_ROOT="/tmp/prophet-release-bundles"
          PROPHET_PROGRAM_ID_CI="$(python3 -c 'import json; print(json.load(open("target/idl/prophet.json", encoding="utf-8"))["address"])')"
          test -n "${PROPHET_PROGRAM_ID_CI}"
          mkdir -p "${CI_ENV_DIR}"
          export CI_ENV_DIR PROPHET_PROGRAM_ID_CI

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src_dir = Path("deploy/environments")
          dst_dir = Path(os.environ["CI_ENV_DIR"])
          program_id = os.environ["PROPHET_PROGRAM_ID_CI"]

          # These copies exist only for the throwaway program identity created
          # by this local CI deployment lane. They are NOT source-config validation.
          for name in ("localnet", "devnet", "mainnet-beta"):
              src = src_dir / f"{name}.json"
              data = json.loads(src.read_text(encoding="utf-8"))
              data["expected_program_id"] = program_id
              data["deployment_authorized"] = False
              if name == "mainnet-beta":
                  data["program_identity_policy"] = "future-unapproved"
              else:
                  data["program_identity_policy"] = "match-source"
              (dst_dir / src.name).write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          echo "EPHEMERAL CI ENVIRONMENT PREPARED"

          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/release.py bundle --environment localnet --release-tag "ci-${GITHUB_SHA}" --bundle-root "${BUNDLE_ROOT}"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/release.py bundle --environment devnet --release-tag "ci-${GITHUB_SHA}" --bundle-root "${BUNDLE_ROOT}"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/release.py bundle --environment mainnet-beta --release-tag "ci-${GITHUB_SHA}" --bundle-root "${BUNDLE_ROOT}"

      - name: Upload Release Bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prophet-release-bundles
          path: /tmp/prophet-release-bundles

      - name: Generate Security Review Bundles
        run: |
          set -euo pipefail
          REVIEW_ROOT="/tmp/prophet-security-review-bundles"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/security_review_bundle.py --environment devnet --release-tag "ci-${GITHUB_SHA}" --review-root "${REVIEW_ROOT}"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/security_review_bundle.py --environment mainnet-beta --release-tag "ci-${GITHUB_SHA}" --review-root "${REVIEW_ROOT}"

      - name: Upload Security Review Bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prophet-security-review-bundles
          path: /tmp/prophet-security-review-bundles

  deployment-config:
    name: Checked-in Deployment Config
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate untouched checked-in environments
        run: |
          python3 scripts/release.py validate-checked-in
          python3 scripts/tests/test_release_config_validation.py -v

      - name: Validate production topology structure
        run: python3 scripts/validate_operated_config.py

      - name: Compose config without real secrets
        run: |
          set -euo pipefail
          SECRET_BASE="$(mktemp -d)"
          RUNTIME_BASE="$(mktemp -d)"
          for environment in devnet public-devnet mainnet-beta; do
            SECRET_ROOT="${SECRET_BASE}/${environment}"
            RUNTIME_ROOT="${RUNTIME_BASE}/${environment}"
            mkdir -p "${SECRET_ROOT}" "${RUNTIME_ROOT}"
            for envfile in resolver-registry.env verifier-a.env verifier-b.env coordinator.env secure-settlement.env matching-keeper.env; do
              : > "${SECRET_ROOT}/${envfile}"
            done
            PROPHET_KEEPER_OPS_TOKEN=ci-placeholder \
            PROPHET_SECRET_ROOT="${SECRET_ROOT}" PROPHET_RUNTIME_ROOT="${RUNTIME_ROOT}" \
              docker compose -f "deploy/operated/${environment}/docker-compose.yml" config >/dev/null
          done
          echo "OPERATED COMPOSE CONFIG PASSED"

  python-locks:
    name: Poetry Lock Authority
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Validate and install committed locks
        run: |
          set -euo pipefail
          for project in sdk/python apps/oracle-attester apps/matching-keeper; do
            echo "checking ${project}"
            (cd "${project}" && poetry check --lock && poetry install --sync --no-interaction)
          done
          git diff --exit-code -- \
            sdk/python/pyproject.toml sdk/python/poetry.lock \
            apps/oracle-attester/pyproject.toml apps/oracle-attester/poetry.lock \
            apps/matching-keeper/pyproject.toml apps/matching-keeper/poetry.lock
          cd apps/oracle-attester
          poetry run python - <<'PY'
          from importlib.metadata import version
          assert version("solana") == "0.33.0"
          assert version("solders") == "0.21.0"
          print('LOCKED SOLANA DEPENDENCY CONTRACT PASSED')
          PY

  production-images:
    name: Production Images + Runtime Contract
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production image vulnerability policy input
        run: |
          test -f security/production-image-vulnerability-exceptions.json
          python3 scripts/validate_container_reproducibility.py
          python3 -m unittest scripts.tests.test_check_trivy_image_scan -v
      - name: Build production-shaped images from repository root
        run: |
          docker build -f apps/oracle-attester/Dockerfile --build-arg IMAGE_REVISION="${GITHUB_SHA}" --build-arg IMAGE_VERSION="ci-${GITHUB_SHA}" -t prophet-oracle-ci .
          docker build -f apps/matching-keeper/Dockerfile --build-arg IMAGE_REVISION="${GITHUB_SHA}" --build-arg IMAGE_VERSION="ci-${GITHUB_SHA}" -t prophet-keeper-ci .
      - name: Oracle runtime imports, versions, and dev-tool absence
        run: |
          # Import-only contract: disable the registry's runtime auth check
          # without supplying a credential. This does not start any service.
          docker run --rm -e RESOLVER_REGISTRY_REQUIRE_AUTH=0 -i prophet-oracle-ci python - <<'PY'
          import importlib.util
          import shutil
          from importlib.metadata import version
          import solders.rpc.responses
          import solana.rpc.api
          import prophet_sdk
          import src.resolver_registry_main
          import src.verifier_a_main
          import src.verifier_b_main
          import src.coordinator_main
          import src.secure_settlement_main
          assert version("solana") == "0.33.0"
          assert version("solders") == "0.21.0"
          assert importlib.util.find_spec('pytest') is None
          assert importlib.util.find_spec('pytest_asyncio') is None
          assert importlib.util.find_spec('poetry') is None
          assert importlib.util.find_spec('pip') is None
          assert importlib.util.find_spec('setuptools') is None
          assert importlib.util.find_spec('msgpack') is None
          assert shutil.which('poetry') is None
          assert shutil.which('pip') is None
          print('ORACLE PRODUCTION RUNTIME CONTRACT PASSED')
          PY
      - name: Keeper runtime dev-tool absence
        run: |
          # Generate a process-local test key inside the container solely to
          # satisfy import-time SDK construction. It is never persisted or logged.
          docker run --rm -e PROPHET_PROGRAM_ID=3AUW4eLPigqyHmQNapcmv3JSYw6s8Aa5PPf87ayGT8kE -i prophet-keeper-ci sh -c 'export PAYER_KEYPAIR_PATH="$(python -c "from solders.keypair import Keypair; print(Keypair())")"; python - <<"PY"
          import importlib.util
          import shutil
          from importlib.metadata import version
          import prophet_sdk
          import src.main
          assert version("solana") == "0.33.0"
          assert version("solders") == "0.21.0"
          assert importlib.util.find_spec("pytest") is None
          assert importlib.util.find_spec("poetry") is None
          assert importlib.util.find_spec("pip") is None
          assert importlib.util.find_spec("setuptools") is None
          assert importlib.util.find_spec("msgpack") is None
          assert shutil.which("poetry") is None
          assert shutil.which("pip") is None
          print("KEEPER PRODUCTION RUNTIME CONTRACT PASSED")
          PY'
      - name: Run P0C1 non-root production runtime regression
        run: python3 -m unittest scripts.tests.test_production_image_nonroot -v
      - name: Run P0C2 production compose sandbox regression
        run: python3 -m unittest scripts.tests.test_production_compose_sandbox -v
      - name: Prepare pinned Trivy vulnerability database
        run: |
          mkdir -p /tmp/trivy-cache
          docker run --rm -v /tmp/trivy-cache:/root/.cache/ aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --download-db-only
      - name: Generate SPDX JSON SBOMs with pinned Syft
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/sbom:/out" anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 prophet-oracle-ci -o spdx-json=/out/oracle.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/sbom:/out" anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 prophet-keeper-ci -o spdx-json=/out/keeper.spdx.json
          python3 - <<'PY'
          import json, os
          payload = {
              'commit_sha': os.environ['GITHUB_SHA'],
              'release_candidate': 'ci-' + os.environ['GITHUB_SHA'],
              'images': ['prophet-oracle-ci', 'prophet-keeper-ci'],
              'format': 'SPDX JSON',
              'syft_version': '1.50.0',
          }
          open('sbom/metadata.json', 'w', encoding='utf-8').write(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Scan final production runtime filesystems and SBOMs
        run: |
          set -euo pipefail
          scan_role() {
            local role="$1"
            local image="$2"
            local rootfs
            local container
            rootfs="$(mktemp -d)"
            container="$(docker create "${image}")"
            docker export "${container}" | tar -x -C "${rootfs}"
            docker rm "${container}"
            docker run --rm -v "${rootfs}":/rootfs:ro -v /tmp/trivy-cache:/root/.cache/ aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --format json /rootfs > "sbom/${role}-rootfs-trivy.json"
            python3 scripts/check_trivy_image_scan.py --report "sbom/${role}-rootfs-trivy.json" --exceptions security/production-image-vulnerability-exceptions.json --role "${role}"
            rm -rf "${rootfs}"
            docker run --rm -v "${PWD}/sbom:/sbom:ro" -v /tmp/trivy-cache:/root/.cache/ aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 sbom --skip-db-update --scanners vuln --severity HIGH,CRITICAL --format json "/sbom/${role}.spdx.json" > "sbom/${role}-sbom-trivy.json"
            python3 scripts/check_trivy_image_scan.py --report "sbom/${role}-sbom-trivy.json" --role "${role}"
          }
          scan_role oracle prophet-oracle-ci
          scan_role keeper prophet-keeper-ci
      - name: Upload production SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc4-production-sbom-${{ github.sha }}
          path: sbom
      - name: Record RC4.7 image and SBOM provenance
        run: |
          python3 scripts/build_rc47_release_provenance.py \
            --output-dir sbom/rc4.7-provenance \
            --commit-sha "${GITHUB_SHA}" \
            --sbom-dir sbom \
            --image oracle=prophet-oracle-ci \
            --image keeper=prophet-keeper-ci
      - name: Upload RC4.7 image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc4.7-image-provenance-${{ github.sha }}
          path: sbom/rc4.7-provenance

  release-security:
    name: Release Secret Hygiene (P-07)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable CI supply chain
        run: python3 scripts/validate_supply_chain_pinning.py
      - name: Python security static gate
        run: python3 scripts/check_python_static.py
      - name: Validate residual-risk manifest
        run: python3 scripts/validate_rc47_risk_manifest.py
      - name: Release bundle secret boundary regression
        run: python3 scripts/tests/test_release_bundle_security.py -v
      - name: Scan tracked release/deployment material
        run: python3 scripts/scan_release_secrets.py

  supply-chain:
    name: Dependency Vulnerability Gates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust project toolchain
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Fetch RustSec advisory database
        run: |
          git clone --no-checkout https://github.com/RustSec/advisory-db.git /tmp/rustsec-advisory-db
          git -C /tmp/rustsec-advisory-db checkout --detach b331df68b3ed0e99594d259040bdcb9de3c7c8a4
          test "$(git -C /tmp/rustsec-advisory-db rev-parse HEAD)" = "b331df68b3ed0e99594d259040bdcb9de3c7c8a4"
          test -n "$(find /tmp/rustsec-advisory-db -name 'RUSTSEC-*.md' -print -quit)"
      - name: Audit committed Cargo.lock
        run: python3 scripts/check_cargo_audit.py --db /tmp/rustsec-advisory-db
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry and pinned pip-audit
        run: python -m pip install "poetry==1.8.5" "pip-audit==2.10.1"
      - name: Verify OSV service reachability
        run: |
          curl -fsS -X POST https://api.osv.dev/v1/query -H 'Content-Type: application/json' -d '{"package":{"name":"pip","ecosystem":"PyPI"}}' >/dev/null
      - name: Audit committed locked Python dependency graphs
        run: |
          set -euo pipefail
          for project in sdk/python apps/oracle-attester apps/matching-keeper; do
            requirements="/tmp/$(echo "${project}" | tr '/' '-')-locked-requirements.txt"
            (cd "${project}" && poetry export --only main --format requirements.txt --without-hashes --output "${requirements}")
            pip-audit --vulnerability-service osv --progress-spinner off --requirement "${requirements}"
          done
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.6"
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Activate pinned Yarn and install frozen lock
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"
          yarn install --frozen-lockfile --non-interactive
      - name: Verify npm registry reachability
        run: npm ping --registry=https://registry.npmjs.org
      - name: Audit JavaScript dependency lock
        run: python3 scripts/check_yarn_audit.py

  release-freeze-invariants:
    name: Release/Freeze 100k Deterministic Invariant
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - name: Run deterministic 100k state-machine campaign
        run: PROPHET_INVARIANT_SEQUENCE_COUNT=100000 cargo test -p prophet state_machine_preserves_economic_invariants_for_thousands_of_seeds --lib --locked

  sdk-python:
    name: SDK Python Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install SDK dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Run SDK tests
        working-directory: sdk/python
        run: poetry run pytest -q tests

  matching-keeper:
    name: Matching Keeper Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install keeper dependencies
        working-directory: apps/matching-keeper
        run: poetry install --no-interaction

      - name: Run keeper tests
        working-directory: apps/matching-keeper
        run: poetry run pytest -q tests

  ops-drills:
    name: Ops Drill Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify Ops Backup / Restore
        run: python3 scripts/verify_ops_backup_restore.py

      - name: Validate Alert Rules
        run: python3 scripts/validate_alert_rules.py

  oracle-attester:
    name: Oracle Attester Tests
    runs-on: ubuntu-22.04
    env:
      SOLANA_VERSION: 3.1.10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust for localtest acceptance
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0

      - name: Install Solana CLI for localtest acceptance
        run: |
          curl -fsSL -o /tmp/solana-install "https://release.anza.xyz/v${SOLANA_VERSION}/install"
          echo "dfd8afbff06d8c0302e11c2fbead5464d5c773097af97c772f3df8470677e130  /tmp/solana-install" | sha256sum -c -
          SOLANA_RELEASE="v${SOLANA_VERSION}" sh /tmp/solana-install
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          solana-test-validator --version
          test "$(solana --version | awk '{print $2}')" = "${SOLANA_VERSION}"
          test "$(solana-test-validator --version | awk '{print $2}')" = "${SOLANA_VERSION}"

      - name: Build localtest program for attester acceptance
        run: |
          cargo build-sbf --manifest-path programs/prophet/Cargo.toml --sbf-out-dir target/deploy -- --locked
          test -f target/deploy/prophet.so

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Run attester tests (exclude e2e)
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests -k "not e2e" --ignore=tests/test_e2e.py

      - name: Validate RC4.8 transaction and runtime acceptance basis
        run: |
          export RC48_SKIP_ANCHOR_E2E=1
          make rc48-security-acceptance

      - name: Validate operated monitoring contract
        run: python3 scripts/validate_operated_monitoring.py

      - name: Run deterministic agent E2E demo
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests/test_agent_e2e_demo.py
