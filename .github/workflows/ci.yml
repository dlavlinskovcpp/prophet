name: CI

on:
  push:
    branches:
      - main
      - master
      - initial-project
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-audit:
    name: Rust + zkTLS Audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          toolchain: 1.89.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run zkTLS guardrail audit
        run: bash scripts/check_zktls.sh

      - name: Cargo check (program)
        run: cargo check -p prophet

      - name: Cargo test (program reliability)
        run: cargo test -p prophet --lib

  anchor-ts:
    name: Anchor TS Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANCHOR_WALLET: /home/runner/.config/solana/id.json
      ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
      ANCHOR_VERSION: 1.0.1
      SOLANA_VERSION: 3.1.10
      NODE_VERSION: 20.19.6
      YARN_VERSION: 1.22.22
      POETRY_VERSION: 1.8.5
      CI_ENV_DIR: /tmp/prophet-release-envs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libssl-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          solana-test-validator --version
          test "$(solana --version | awk '{print $2}')" = "${SOLANA_VERSION}"
          test "$(solana-test-validator --version | awk '{print $2}')" = "${SOLANA_VERSION}"
        
      - name: Verify SBF Toolchain
        run: |
          cargo build-sbf --version
          cargo build-sbf --manifest-path programs/prophet/Cargo.toml --help >/dev/null

      - name: Install Anchor CLI
        run: |
          cargo install \
            --git https://github.com/solana-foundation/anchor \
            --tag "v${ANCHOR_VERSION}" \
            anchor-cli \
            --locked \
            --force
          anchor --version
          test "$(anchor --version)" = "anchor-cli ${ANCHOR_VERSION}"

      - name: Verify pinned toolchain
        run: |
          anchor --version
          solana --version
          solana-test-validator --version
          rustc --version
          node --version
          yarn --version
          test "$(rustc --version | awk '{print $2}')" = "1.89.0"
          test "$(node --version)" = "v${NODE_VERSION}"

      - name: Clean build artifacts
        run: |
          cargo clean
          rm -rf target .anchor/test-ledger

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Run Attester Unit Tests
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests/test_signer_backend.py tests/test_signer_allowlist.py tests/test_remote_signer.py tests/test_signer_ops.py tests/test_vault_transit.py

      - name: Install SDK Python dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Create test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$ANCHOR_WALLET"
          solana config set --keypair "$ANCHOR_WALLET"

      - name: Sync Program ID to CI Program Keypair
        run: |
          mkdir -p target/deploy
          if [ ! -f target/deploy/prophet-keypair.json ]; then
            solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/prophet-keypair.json
          fi
          anchor keys sync -p prophet
          anchor keys list

      - name: Build Anchor program
        run: anchor build

      - name: Run Anchor Tests
        run: |
          set -euo pipefail
          solana config set --url "$ANCHOR_PROVIDER_URL"
          VAULT_CONTAINER="prophet-ci-vault"
          VAULT_ADDR_LOCAL="http://127.0.0.1:18200"
          VAULT_TOKEN_LOCAL="root"
          VAULT_KEY_NAME_LOCAL="prophet-ci-notary"
          VAULT_NEXT_KEY_NAME_LOCAL="prophet-ci-notary-rotated"

          mkdir -p .anchor/test-ledger
          VALIDATOR_LOG="/tmp/prophet-ci-validator.log"
          rm -f "${VALIDATOR_LOG}"

          solana-test-validator --reset \
            --ledger .anchor/test-ledger \
            --bind-address 127.0.0.1 \
            --rpc-port 8899 \
            --faucet-port 9901 \
            --gossip-port 10256 \
            --dynamic-port-range 10240-10300 \
            >"${VALIDATOR_LOG}" 2>&1 &

          VALIDATOR_PID=$!

          cleanup() {
            docker rm -f "${VAULT_CONTAINER}" >/dev/null 2>&1 || true
            kill "${VALIDATOR_PID}" 2>/dev/null || true
            wait "${VALIDATOR_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 120); do
            if curl -s -X POST http://127.0.0.1:8899 \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' | grep -q '"result"'; then
              echo "Validator is ready"
              break
            fi

            if ! kill -0 "${VALIDATOR_PID}" 2>/dev/null; then
              echo "Validator exited before becoming ready"
              cat "${VALIDATOR_LOG}" || true
              exit 1
            fi

            if [ "${i}" -eq 120 ]; then
              echo "Validator did not become ready in time"
              cat "${VALIDATOR_LOG}" || true
              exit 1
            fi

            sleep 1
          done

          if ! anchor test --skip-build --skip-lint --skip-local-validator; then
            echo "Anchor tests failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          PROPHET_PROGRAM_ID_CI="$(anchor keys list | awk '/prophet:/ {print $2}')"
          echo "Using deployed Prophet program id: ${PROPHET_PROGRAM_ID_CI}"

          if ! (cd apps/oracle-attester && RUN_LOCALNET=1 RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="${PROPHET_PROGRAM_ID_CI}" poetry run pytest -q tests/test_localnet_threshold_e2e.py); then
            echo "Attester localnet threshold e2e failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          if ! (cd sdk/python && RUN_LOCALNET=1 RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="${PROPHET_PROGRAM_ID_CI}" PAYER_KEYPAIR_PATH="$ANCHOR_WALLET" ORACLE_KEYPAIR_PATH="$ANCHOR_WALLET" QUOTE_MINT="So11111111111111111111111111111111111111112" poetry run pytest -q tests/test_localnet_e2e.py); then
            echo "SDK localnet threshold e2e failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          if ! (RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="${PROPHET_PROGRAM_ID_CI}" python3 scripts/operated_localnet_smoke.py); then
            echo "Operated localnet smoke failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          docker rm -f "${VAULT_CONTAINER}" >/dev/null 2>&1 || true
          docker run -d --rm --name "${VAULT_CONTAINER}" -p 127.0.0.1:18200:8200 hashicorp/vault:1.16 \
            vault server -dev -dev-root-token-id="${VAULT_TOKEN_LOCAL}" -dev-listen-address=0.0.0.0:8200

          for i in $(seq 1 60); do
            if curl -fsS "${VAULT_ADDR_LOCAL}/v1/sys/health" >/dev/null; then
              echo "Vault dev server is ready"
              break
            fi

            if [ "${i}" -eq 60 ]; then
              echo "Vault dev server did not become ready in time"
              docker logs "${VAULT_CONTAINER}" || true
              exit 1
            fi

            sleep 1
          done

          curl -fsS \
            -X POST \
            -H "X-Vault-Token: ${VAULT_TOKEN_LOCAL}" \
            -H "Content-Type: application/json" \
            --data '{"type":"transit"}' \
            "${VAULT_ADDR_LOCAL}/v1/sys/mounts/transit" >/dev/null

          curl -fsS \
            -X POST \
            -H "X-Vault-Token: ${VAULT_TOKEN_LOCAL}" \
            -H "Content-Type: application/json" \
            --data '{"type":"ed25519"}' \
            "${VAULT_ADDR_LOCAL}/v1/transit/keys/${VAULT_KEY_NAME_LOCAL}" >/dev/null

          curl -fsS \
            -X POST \
            -H "X-Vault-Token: ${VAULT_TOKEN_LOCAL}" \
            -H "Content-Type: application/json" \
            --data '{"type":"ed25519"}' \
            "${VAULT_ADDR_LOCAL}/v1/transit/keys/${VAULT_NEXT_KEY_NAME_LOCAL}" >/dev/null

          if ! (RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="${PROPHET_PROGRAM_ID_CI}" python3 scripts/operated_localnet_smoke.py --signer-backend vault_transit --vault-addr "${VAULT_ADDR_LOCAL}" --vault-token "${VAULT_TOKEN_LOCAL}" --vault-key-name "${VAULT_KEY_NAME_LOCAL}"); then
            echo "Operated localnet Vault smoke failed; validator log follows:"
            docker logs "${VAULT_CONTAINER}" || true
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          if ! (RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="${PROPHET_PROGRAM_ID_CI}" python3 scripts/operated_localnet_smoke.py --signer-backend vault_transit --vault-addr "${VAULT_ADDR_LOCAL}" --vault-token "${VAULT_TOKEN_LOCAL}" --vault-key-name "${VAULT_KEY_NAME_LOCAL}" --vault-next-key-name "${VAULT_NEXT_KEY_NAME_LOCAL}"); then
            echo "Operated localnet Vault rotation smoke failed; validator log follows:"
            docker logs "${VAULT_CONTAINER}" || true
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

      - name: Generate Release Bundles
        run: |
          set -euo pipefail
          BUNDLE_ROOT="/tmp/prophet-release-bundles"
          PROPHET_PROGRAM_ID_CI="$(solana address -k target/deploy/prophet-keypair.json)"
          mkdir -p "${CI_ENV_DIR}"
          export CI_ENV_DIR PROPHET_PROGRAM_ID_CI

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src_dir = Path("deploy/environments")
          dst_dir = Path(os.environ["CI_ENV_DIR"])
          program_id = os.environ["PROPHET_PROGRAM_ID_CI"]

          for name in ("localnet", "devnet", "mainnet-beta"):
              src = src_dir / f"{name}.json"
              data = json.loads(src.read_text(encoding="utf-8"))
              data["expected_program_id"] = program_id
              (dst_dir / src.name).write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/release.py bundle --environment localnet --release-tag "ci-${GITHUB_SHA}" --bundle-root "${BUNDLE_ROOT}"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/release.py bundle --environment devnet --release-tag "ci-${GITHUB_SHA}" --bundle-root "${BUNDLE_ROOT}"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/release.py bundle --environment mainnet-beta --release-tag "ci-${GITHUB_SHA}" --bundle-root "${BUNDLE_ROOT}"

      - name: Upload Release Bundles
        uses: actions/upload-artifact@v4
        with:
          name: prophet-release-bundles
          path: /tmp/prophet-release-bundles

      - name: Generate Security Review Bundles
        run: |
          set -euo pipefail
          REVIEW_ROOT="/tmp/prophet-security-review-bundles"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/security_review_bundle.py --environment devnet --release-tag "ci-${GITHUB_SHA}" --review-root "${REVIEW_ROOT}"
          PROPHET_RELEASE_ENVIRONMENTS_DIR="${CI_ENV_DIR}" python3 scripts/security_review_bundle.py --environment mainnet-beta --release-tag "ci-${GITHUB_SHA}" --review-root "${REVIEW_ROOT}"

      - name: Upload Security Review Bundles
        uses: actions/upload-artifact@v4
        with:
          name: prophet-security-review-bundles
          path: /tmp/prophet-security-review-bundles

  sdk-python:
    name: SDK Python Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install SDK dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Run SDK tests
        working-directory: sdk/python
        run: poetry run pytest -q tests/test_smoke.py tests/test_tx_submit.py

  matching-keeper:
    name: Matching Keeper Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install keeper dependencies
        working-directory: apps/matching-keeper
        run: poetry install --no-interaction

      - name: Run keeper tests
        working-directory: apps/matching-keeper
        run: poetry run pytest -q tests/test_engine.py tests/test_service.py tests/test_storage.py

  ops-drills:
    name: Ops Drill Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Ops Backup / Restore
        run: python3 scripts/verify_ops_backup_restore.py

      - name: Validate Alert Rules
        run: python3 scripts/validate_alert_rules.py

  oracle-attester:
    name: Oracle Attester Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Run attester tests (exclude e2e)
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests -k "not e2e" --ignore=tests/test_e2e.py
