name: CI

on:
  push:
    branches:
      - main
      - master
      - initial-project
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-audit:
    name: Rust + zkTLS Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run zkTLS guardrail audit
        run: bash scripts/check_zktls.sh

      - name: Cargo check (program)
        run: cargo check -p prophet

  anchor-ts:
    name: Anchor TS Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANCHOR_WALLET: /home/runner/.config/solana/id.json
      ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
      ANCHOR_CLI_VERSION: 0.32.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libssl-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          solana-test-validator --version
        
      - name: Verify SBF Toolchain
        run: |
          cargo build-sbf --version
          cargo build-sbf --manifest-path programs/prophet/Cargo.toml --help >/dev/null

      - name: Install Anchor CLI
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) TARGET="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) TARGET="aarch64-unknown-linux-gnu" ;;
            *)
              echo "Unsupported runner architecture: $ARCH"
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.local/bin"
          URL="https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_CLI_VERSION}/anchor-${ANCHOR_CLI_VERSION}-${TARGET}"
          echo "Downloading Anchor CLI from: $URL"
          curl -fsSL "$URL" -o "$HOME/.local/bin/anchor"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          anchor --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Install SDK Python dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Create test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$ANCHOR_WALLET"
          solana config set --keypair "$ANCHOR_WALLET"

      - name: Sync Program ID to CI Program Keypair
        run: |
          mkdir -p target/deploy
          if [ ! -f target/deploy/prophet-keypair.json ]; then
            solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/prophet-keypair.json
          fi
          anchor keys sync -p prophet
          anchor keys list

      - name: Run Anchor Tests
        run: |
          set -euo pipefail
          solana config set --url "$ANCHOR_PROVIDER_URL"

          mkdir -p .anchor/test-ledger
          VALIDATOR_LOG=".anchor/test-ledger/test-ledger-log.txt"

          solana-test-validator --reset \
            --ledger .anchor/test-ledger \
            --bind-address 127.0.0.1 \
            --rpc-port 8899 \
            --faucet-port 9901 \
            --gossip-port 10256 \
            --dynamic-port-range 10240-10300 \
            >"${VALIDATOR_LOG}" 2>&1 &

          VALIDATOR_PID=$!

          cleanup() {
            kill "${VALIDATOR_PID}" 2>/dev/null || true
            wait "${VALIDATOR_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 120); do
            if curl -s -X POST http://127.0.0.1:8899 \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' | grep -q '"result"'; then
              echo "Validator is ready"
              break
            fi

            if ! kill -0 "${VALIDATOR_PID}" 2>/dev/null; then
              echo "Validator exited before becoming ready"
              cat "${VALIDATOR_LOG}" || true
              exit 1
            fi

            if [ "${i}" -eq 120 ]; then
              echo "Validator did not become ready in time"
              cat "${VALIDATOR_LOG}" || true
              exit 1
            fi

            sleep 1
          done

          if ! anchor test --skip-lint --skip-local-validator; then
            echo "Anchor tests failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          if ! (cd apps/oracle-attester && RUN_LOCALNET=1 RPC_URL="$ANCHOR_PROVIDER_URL" PROPHET_PROGRAM_ID="$(anchor keys list | awk '/prophet:/ {print $2}')" poetry run pytest -q tests/test_localnet_threshold_e2e.py); then
            echo "Attester localnet threshold e2e failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

          if ! (cd sdk/python && RUN_LOCALNET=1 RPC_URL="$ANCHOR_PROVIDER_URL" PAYER_KEYPAIR_PATH="$ANCHOR_WALLET" ORACLE_KEYPAIR_PATH="$ANCHOR_WALLET" QUOTE_MINT="So11111111111111111111111111111111111111112" poetry run pytest -q tests/test_localnet_e2e.py); then
            echo "SDK localnet threshold e2e failed; validator log follows:"
            if [ -f "${VALIDATOR_LOG}" ]; then
              cat "${VALIDATOR_LOG}" || true
            else
              echo "Validator log file not found at ${VALIDATOR_LOG}"
            fi
            exit 1
          fi

  sdk-python:
    name: SDK Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install SDK dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Run SDK tests
        working-directory: sdk/python
        run: poetry run pytest -q tests/test_smoke.py tests/test_tx_submit.py

  matching-keeper:
    name: Matching Keeper Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install keeper dependencies
        working-directory: apps/matching-keeper
        run: poetry install --no-interaction

      - name: Run keeper tests
        working-directory: apps/matching-keeper
        run: poetry run pytest -q tests/test_engine.py tests/test_storage.py

  oracle-attester:
    name: Oracle Attester Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Run attester tests (exclude e2e)
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests -k "not e2e" --ignore=tests/test_e2e.py
