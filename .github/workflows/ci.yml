name: CI

on:
  push:
    branches:
      - main
      - master
      - initial-project
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-audit:
    name: Rust + zkTLS Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run zkTLS guardrail audit
        run: bash scripts/check_zktls.sh

      - name: Cargo check (program)
        run: cargo check -p prophet

  anchor-ts:
    name: Anchor TS Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.16/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          npm install -g @coral-xyz/anchor-cli@latest
          anchor --version

      - name: Create test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - name: Start local validator
        run: bash scripts/localnet_start.sh

      - name: Build and deploy program
        run: |
          export ANCHOR_PROVIDER_URL="http://127.0.0.1:8899"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          solana config set --url "$ANCHOR_PROVIDER_URL"
          solana airdrop 100 "$(solana address)" || true
          anchor build
          anchor deploy
          mkdir -p target/idl target/types
          anchor idl build -p prophet -o target/idl/prophet.json -t target/types/prophet.ts
          test -f target/idl/prophet.json
          test -f target/types/prophet.ts

      - name: Run Anchor TS suites
        run: |
          export ANCHOR_PROVIDER_URL="http://127.0.0.1:8899"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          yarn run ts-mocha -p ./tsconfig.json -t 1000000 \
            tests/prophet.ts \
            tests/prophet_threshold.ts \
            tests/prophet_invariants.ts

      - name: Stop local validator
        if: always()
        run: bash scripts/localnet_stop.sh

  sdk-python:
    name: SDK Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install SDK dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Run SDK tests
        working-directory: sdk/python
        run: poetry run pytest -q tests/test_smoke.py tests/test_tx_submit.py

  oracle-attester:
    name: Oracle Attester Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install attester dependencies
        working-directory: apps/oracle-attester
        run: poetry install --no-interaction --no-root

      - name: Run attester tests (exclude e2e)
        working-directory: apps/oracle-attester
        run: poetry run pytest -q tests -k "not e2e" --ignore=tests/test_e2e.py
