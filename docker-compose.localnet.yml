# Local validator is intentionally native, not a stale Solana v1.17 image.
# Start scripts/localnet_start.sh; it enforces Agave/Solana CLI 3.1.10.
services:
  resolver-registry:
    build:
      context: .
      dockerfile: apps/oracle-attester/Dockerfile
    command: uvicorn src.resolver_registry_main:app --host 0.0.0.0 --port 8200
    ports:
      - "8200:8200"
    environment:
      APP_ENV: local
      RESOLVER_STORE_DIR: /app/resolver_store
      RESOLVER_REGISTRY_REQUIRE_AUTH: "1"
      RESOLVER_REGISTRY_SERVICE_API_KEY: ${RESOLVER_REGISTRY_SERVICE_API_KEY:-localnet-resolver-registry-token}
      RESOLVER_REGISTRY_MAX_REQUEST_BYTES: 100000
      RESOLVER_REGISTRY_AUDIT_LOG_PATH: /app/audit/resolver-registry.jsonl
      RATE_LIMIT_ENABLED: "0"
      METRICS_ENABLED: "1"
    volumes:
      - ./resolver_store:/app/resolver_store
      - ./audit:/app/audit

  matching-keeper:
    build:
      context: .
      dockerfile: apps/matching-keeper/Dockerfile
    ports:
      - "8010:8010"
    environment:
      RPC_URL: ${LOCALNET_RPC_URL:-http://host.docker.internal:8899}
      WS_URL: ${LOCALNET_WS_URL:-ws://host.docker.internal:8900}
      PROPHET_PROGRAM_ID: ${PROPHET_PROGRAM_ID:?PROPHET_PROGRAM_ID must be set explicitly}
      PAYER_KEYPAIR_PATH: /app/apps/matching-keeper/id.json
      MARKET_DISCOVERY_MODE: program_scan
      REQUIRE_NOTARY_CONFIG: "1"
      DB_PATH: /app/apps/matching-keeper/state/matcher.db
      POLL_MS: 250
      SNAPSHOT_RESYNC_S: 300
      DISCOVERY_INTERVAL_S: 60
      PRUNE_INTERVAL_S: 3600
      STALE_WS_THRESHOLD_S: 120
      LOG_LEVEL: INFO
    volumes:
      - ./apps/matching-keeper/state:/app/apps/matching-keeper/state
      - ./id.json:/app/apps/matching-keeper/id.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - resolver-registry
      - matching-keeper

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
