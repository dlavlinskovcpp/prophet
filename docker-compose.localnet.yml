services:
  validator:
    image: solanalabs/solana:v1.17.0
    command: solana-test-validator --reset --rpc-port 8899 --ws-port 8900 --ledger /ledger
    ports:
      - "8899:8899"
      - "8900:8900"
      - "9900:9900" # Faucet
    volumes:
      - ./.anchor/test-ledger:/ledger

  resolver-registry:
    build:
      context: ./apps/oracle-attester
      dockerfile: Dockerfile
    command: uvicorn src.resolver_registry_main:app --host 0.0.0.0 --port 8200
    ports:
      - "8200:8200"
    environment:
      APP_ENV: local
      RESOLVER_STORE_DIR: /app/resolver_store
      RESOLVER_REGISTRY_REQUIRE_AUTH: "1"
      RESOLVER_REGISTRY_SERVICE_API_KEY: ${RESOLVER_REGISTRY_SERVICE_API_KEY:-localnet-resolver-registry-token}
      RESOLVER_REGISTRY_MAX_REQUEST_BYTES: 100000
      RESOLVER_REGISTRY_AUDIT_LOG_PATH: /app/audit/resolver-registry.jsonl
      RATE_LIMIT_ENABLED: "0"
      METRICS_ENABLED: "1"
    volumes:
      - ./resolver_store:/app/resolver_store
      - ./audit:/app/audit

  remote-signer:
    build:
      context: ./apps/oracle-attester
      dockerfile: Dockerfile
    command: uvicorn src.remote_signer_main:app --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"
    environment:
      APP_ENV: local
      ALLOW_LOCAL_NOTARY_KEYS: "1"
      NOTARY_KEYPAIR_PATHS: /app/oracle-keypair.json
      REMOTE_SIGNER_REQUIRE_AUTH: "1"
      REMOTE_SIGNER_API_KEY: ${REMOTE_SIGNER_API_KEY:-localnet-remote-signer-token}
      REMOTE_SIGNER_BACKEND: command
      REMOTE_SIGNER_COMMAND: python /app/scripts/local_command_signer.py
      REMOTE_SIGNER_COMMAND_TIMEOUT_S: 5
      REMOTE_SIGNER_REQUIRE_ALLOWLIST: "0"
      REMOTE_SIGNER_AUDIT_LOG_PATH: /app/audit/remote-signer.jsonl
      RATE_LIMIT_ENABLED: "0"
      METRICS_ENABLED: "1"
    volumes:
      - ./oracle-keypair.json:/app/oracle-keypair.json:ro
      - ./audit:/app/audit

  oracle-attester:
    build:
      context: ./apps/oracle-attester
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RPC_URL: http://validator:8899
      ORACLE_KEYPAIR_PATH: /app/oracle-keypair.json
      PROOF_STORE_DIR: /app/proof_store
      APP_ENV: local
      ZKTLS_MODE: reclaim_http
      REQUIRE_ZKTLS: "1"
      RECLAIM_VERIFY_URL: ${RECLAIM_VERIFY_URL:-https://reclaim.invalid/verify}
      RECLAIM_API_KEY: ${RECLAIM_API_KEY:-}
      NOTARY_SIGNER_MODE: remote
      REMOTE_SIGNER_URL: http://remote-signer:8100/sign
      REMOTE_SIGNER_API_KEY: ${REMOTE_SIGNER_API_KEY:-localnet-remote-signer-token}
      REMOTE_SIGNER_REQUIRE_TLS: "0"
      RESOLVER_REGISTRY_MODE: http
      RESOLVER_REGISTRY_URL: http://resolver-registry:8200/resolvers
      RESOLVER_REGISTRY_API_KEY: ${RESOLVER_REGISTRY_SERVICE_API_KEY:-localnet-resolver-registry-token}
      RESOLVER_REGISTRY_REQUIRE_TLS: "0"
      ATTESTER_AUDIT_LOG_PATH: /app/audit/attester.jsonl
      REQUIRE_API_AUTH: "0"
      RATE_LIMIT_ENABLED: "0"
    volumes:
      - ./proof_store:/app/proof_store
      - ./audit:/app/audit
      - ./oracle-keypair.json:/app/oracle-keypair.json # Mount keypair if needed
    depends_on:
      - validator
      - resolver-registry
      - remote-signer

  matching-keeper:
    build:
      context: .
      dockerfile: apps/matching-keeper/Dockerfile
    ports:
      - "8010:8010"
    environment:
      RPC_URL: http://validator:8899
      WS_URL: ws://validator:8900
      PROPHET_PROGRAM_ID: ${PROPHET_PROGRAM_ID:-913Xp7ck53fMFTjGdKtjiwQXsBa4SfC9hce1SVGr3G9A}
      PAYER_KEYPAIR_PATH: /app/apps/matching-keeper/id.json
      MARKET_DISCOVERY_MODE: program_scan
      REQUIRE_NOTARY_CONFIG: "1"
      DB_PATH: /app/apps/matching-keeper/state/matcher.db
      POLL_MS: 250
      SNAPSHOT_RESYNC_S: 300
      DISCOVERY_INTERVAL_S: 60
      PRUNE_INTERVAL_S: 3600
      STALE_WS_THRESHOLD_S: 120
      LOG_LEVEL: INFO
    volumes:
      - ./apps/matching-keeper/state:/app/apps/matching-keeper/state
      - ./id.json:/app/apps/matching-keeper/id.json:ro
    depends_on:
      - validator

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - resolver-registry
      - remote-signer
      - oracle-attester
      - matching-keeper

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
