[package]
name = "prophet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prophet"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Host-only helpers used by the cargo-fuzz harnesses. This feature is never
# enabled for an on-chain program build.
fuzzing = []

[dependencies]
anchor-lang = { version = "=1.0.1", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.1", default-features = false, features = ["token", "associated_token", "token_2022"] }
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
