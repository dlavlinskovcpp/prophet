[tool.poetry]
name = "oracle-attester"
version = "0.4.0"
description = "Oracle Attester Service for Prophet Protocol"
authors = ["Prophet Protocol <dev@prophet.xyz>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
solana = "^0.32.0"
solders = "^0.21.0"
base58 = "^2.1.1"
httpx = "^0.26.0"
borsh-construct = "^0.1.0"
cachetools = "^5.3.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"