[tool.poetry]
name = "oracle-attester"
version = "0.4.0"
description = "Oracle Attester Service for Prophet Protocol"
authors = ["Prophet Protocol <dev@prophet.xyz>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.141.1"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
solana = "0.33.0"
solders = "0.21.0"
prophet-sdk = {path = "../../sdk/python", develop = false}
base58 = "^2.1.1"
httpx = "0.28.1"
borsh-construct = "^0.1.0"
cachetools = ">=4.2.2,<5.0.0"
boto3 = "^1.34.0"
pyyaml = "^6.0.2"
h11 = "0.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = ">=1.0,<2"
pip-audit = "^2.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
