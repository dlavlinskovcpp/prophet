global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prophet-resolver-registry
    metrics_path: /metrics
    static_configs:
      - targets:
          - resolver-registry:8200

  - job_name: prophet-matching-keeper
    metrics_path: /metrics
    static_configs:
      - targets:
          - matching-keeper:8010
