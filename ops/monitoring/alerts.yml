groups:
  - name: prophet-services
    rules:
      - alert: ProphetOracleAttesterDown
        expr: up{job="prophet-oracle-attester"} == 0
        for: 1m
        labels:
          severity: critical
          service: oracle-attester
        annotations:
          summary: Prophet oracle attester is down
          description: Prometheus cannot scrape the oracle attester /metrics endpoint.

      - alert: ProphetRemoteSignerDown
        expr: up{job="prophet-remote-signer"} == 0
        for: 1m
        labels:
          severity: critical
          service: remote-signer
        annotations:
          summary: Prophet remote signer is down
          description: Prometheus cannot scrape the remote signer /metrics endpoint.

      - alert: ProphetResolverRegistryDown
        expr: up{job="prophet-resolver-registry"} == 0
        for: 1m
        labels:
          severity: critical
          service: resolver-registry
        annotations:
          summary: Prophet resolver registry is down
          description: Prometheus cannot scrape the resolver registry /metrics endpoint.

      - alert: ProphetAttesterResolveErrors
        expr: increase(prophet_attester_resolve_total{result=~"runtime_error|internal_error"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          service: oracle-attester
        annotations:
          summary: Prophet attester returned runtime or internal resolve errors
          description: The attester emitted failing resolve results in the last 10 minutes.

      - alert: ProphetRemoteSignerBackendErrors
        expr: increase(prophet_remote_signer_sign_total{result="backend_error"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          service: remote-signer
        annotations:
          summary: Prophet remote signer backend errors detected
          description: The remote signer backend returned signing failures in the last 10 minutes.

  - name: prophet-matching-keeper
    rules:
      - alert: ProphetMatchingKeeperDown
        expr: up{job="prophet-matching-keeper"} == 0 or prophet_matching_keeper_up == 0
        for: 1m
        labels:
          severity: critical
          service: matching-keeper
        annotations:
          summary: Prophet matching keeper is down
          description: Prometheus cannot scrape the keeper or the keeper reports itself as down.

      - alert: ProphetMatchingKeeperWebsocketStale
        expr: prophet_matching_keeper_websocket_stale == 1
        for: 2m
        labels:
          severity: warning
          service: matching-keeper
        annotations:
          summary: Prophet matching keeper websocket feed is stale
          description: The keeper has active markets but websocket ingestion is stale.

      - alert: ProphetMatchingKeeperDirtyOrderBacklog
        expr: prophet_matching_keeper_active_markets > 0 and prophet_matching_keeper_dirty_orders > 100
        for: 10m
        labels:
          severity: warning
          service: matching-keeper
        annotations:
          summary: Prophet matching keeper dirty-order backlog is growing
          description: Dirty orders have stayed above 100 across active markets for the last 10 minutes.

      - alert: ProphetMatchingKeeperSnapshotLag
        expr: prophet_matching_keeper_active_markets > 0 and prophet_matching_keeper_max_snapshot_age_seconds > 600
        for: 10m
        labels:
          severity: warning
          service: matching-keeper
        annotations:
          summary: Prophet matching keeper snapshots are lagging
          description: The oldest active market snapshot has been stale for more than 10 minutes.

      - alert: ProphetMatchingKeeperNoActiveMarkets
        expr: prophet_matching_keeper_active_markets == 0
        for: 10m
        labels:
          severity: warning
          service: matching-keeper
        annotations:
          summary: Prophet matching keeper has no active markets
          description: No markets are currently active in the keeper runtime.
