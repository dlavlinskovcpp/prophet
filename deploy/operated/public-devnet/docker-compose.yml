# Production-shaped secure-coordinator topology.
# Generic remote signer and direct oracle-attester settlement are intentionally absent.
services:
  vault:
    image: hashicorp/vault:1.17.6
    command: vault server -config=/vault/config/vault.hcl
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/vault:/vault/file
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/vault-audit:/vault/audit
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/vault/vault.hcl:/vault/config/vault.hcl:ro
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/vault/tls:/vault/tls:ro
    restart: unless-stopped
    networks: [control]

  resolver-registry:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.resolver_registry_main:app --host 0.0.0.0 --port 8200
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/resolver-registry.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/resolver_store:/app/resolver_store
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/resolver_audit:/app/audit
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control]

  verifier-a:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.verifier_a_main:app --host 0.0.0.0 --port 8301
    environment:
      PROPHET_VERIFIER_RUNTIME_CONFIG: /app/runtime/verifier-a.yaml
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/verifier-a.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/config/verifier-a.yaml:/app/runtime/verifier-a.yaml:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control, egress]

  verifier-b:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.verifier_b_main:app --host 0.0.0.0 --port 8302
    environment:
      PROPHET_VERIFIER_RUNTIME_CONFIG: /app/runtime/verifier-b.yaml
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/verifier-b.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/config/verifier-b.yaml:/app/runtime/verifier-b.yaml:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control, egress]

  coordinator:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.coordinator_main:app --host 0.0.0.0 --port 8400
    environment:
      PROPHET_COORDINATOR_RUNTIME_CONFIG: /app/runtime/coordinator-runtime.yaml
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/coordinator.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/config/coordinator-runtime.yaml:/app/runtime/coordinator-runtime.yaml:ro
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/coordinator:/var/lib/prophet/public-devnet/coordinator
    depends_on: [verifier-a, verifier-b]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control]

  matching-keeper:
    build: { context: ../../.., dockerfile: apps/matching-keeper/Dockerfile }
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/matching-keeper.env"
    environment:
      ENVIRONMENT: public-devnet
      PAYER_KEYPAIR_PATH: /run/secrets/keeper-id.json
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/matching-keeper:/app/apps/matching-keeper/state
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/keeper-id.json:/run/secrets/keeper-id.json:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [egress]

  prometheus:
    image: prom/prometheus:v2.54.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --web.enable-admin-api=false]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/prometheus:/prometheus
    restart: unless-stopped
    networks: [control, egress]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: [--config.file=/run/secrets/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/alertmanager.yml:/run/secrets/alertmanager.yml:ro
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/alertmanager:/alertmanager
    restart: unless-stopped
    networks: [control, egress]

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: ${PROPHET_SECRET_ROOT:-/etc/prophet/public-devnet}/grafana-admin-password
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/public-devnet}/grafana:/var/lib/grafana
    restart: unless-stopped
    networks: [control]

networks:
  control:
    internal: true
  egress: {}
