schema_version: 1
environment: public-devnet
mode: production
solana:
  cluster: devnet
  genesis_hash: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG
  prophet_program_id: 3AUW4eLPigqyHmQNapcmv3JSYw6s8Aa5PPf87ayGT8kE
resolver_v2: {schema_version: 2}
verifier: {implementation_id: prophet.verifier.runtime.a, version: 2.0.0}
verifier_attestation:
  public_key: REPLACE_WITH_VERIFIER_A_ATTESTATION_PUBLIC_KEY
  private_key_env: PROPHET_VERIFIER_A_ATTESTATION_PRIVATE_KEY
allowed_adapters: [zktls]
zktls:
  provider_id: public-devnet-primary-zktls
  verifier_backend: bound-http
