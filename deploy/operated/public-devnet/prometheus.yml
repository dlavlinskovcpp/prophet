global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: [alertmanager:9093]}]}]
scrape_configs:
  - job_name: prophet-oracle-attester
    static_configs: [{targets: [oracle-attester:8000]}]
  - job_name: prophet-remote-signer
    static_configs: [{targets: [remote-signer:8100]}]
  - job_name: prophet-resolver-registry
    static_configs: [{targets: [resolver-registry:8200]}]
  - job_name: prophet-matching-keeper
    static_configs: [{targets: [matching-keeper:8010]}]
  - job_name: vault
    metrics_path: /v1/sys/metrics
    static_configs: [{targets: [vault:8200]}]
