global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: [alertmanager:9093]}]}]
scrape_configs:
  - job_name: prophet-verifier-a
    static_configs: [{targets: [verifier-a:8301]}]
  - job_name: prophet-verifier-b
    static_configs: [{targets: [verifier-b:8302]}]
  - job_name: prophet-coordinator
    static_configs: [{targets: [coordinator:8400]}]
  - job_name: prophet-resolver-registry
    static_configs: [{targets: [resolver-registry:8200]}]
  - job_name: prophet-matching-keeper
    static_configs: [{targets: [matching-keeper:8010]}]
    bearer_token_file: /run/secrets/keeper-ops-token
  - job_name: vault
    scheme: https
    metrics_path: /v1/sys/metrics
    static_configs: [{targets: [vault:8200]}]
    bearer_token_file: /run/secrets/vault-metrics-token
    tls_config:
      ca_file: /run/secrets/vault-ca.crt
      server_name: vault
      insecure_skip_verify: false
