# Production-shaped secure-coordinator topology.
# Generic remote signer and direct oracle-attester settlement are intentionally absent.
services:
  resolver-registry:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.resolver_registry_main:app --host 0.0.0.0 --port 8200
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/resolver-registry.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/resolver_store:/app/resolver_store
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/resolver_audit:/app/audit
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control]

  verifier-a:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.verifier_a_main:app --host 0.0.0.0 --port 8301
    environment:
      PROPHET_VERIFIER_RUNTIME_CONFIG: /app/runtime/verifier-a.yaml
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/verifier-a.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/config/verifier-a.yaml:/app/runtime/verifier-a.yaml:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control, egress]

  verifier-b:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.verifier_b_main:app --host 0.0.0.0 --port 8302
    environment:
      PROPHET_VERIFIER_RUNTIME_CONFIG: /app/runtime/verifier-b.yaml
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/verifier-b.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/config/verifier-b.yaml:/app/runtime/verifier-b.yaml:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control, egress]

  coordinator:
    build: { context: ../../.., dockerfile: apps/oracle-attester/Dockerfile }
    command: uvicorn src.coordinator_main:app --host 0.0.0.0 --port 8400
    environment:
      PROPHET_COORDINATOR_RUNTIME_CONFIG: /app/runtime/coordinator-runtime.yaml
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/coordinator.env"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/config/coordinator-runtime.yaml:/app/runtime/coordinator-runtime.yaml:ro
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/coordinator:/var/lib/prophet/mainnet-beta/coordinator
    depends_on: [verifier-a, verifier-b]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [control]

  matching-keeper:
    build: { context: ../../.., dockerfile: apps/matching-keeper/Dockerfile }
    env_file:
      - "${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/matching-keeper.env"
    environment:
      PAYER_KEYPAIR_PATH: /run/secrets/keeper-id.json
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/matching-keeper:/app/apps/matching-keeper/state
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/keeper-id.json:/run/secrets/keeper-id.json:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    restart: on-failure:5
    networks: [egress]

networks:
  control:
    internal: true
  egress: {}
