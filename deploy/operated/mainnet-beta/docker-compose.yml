# Copy the *.env.example files in this directory to *.env and replace all
# example secrets before bringing up the stack.
#
# Runtime state defaults to /var/lib/prophet/mainnet-beta.
# Secret material defaults to /etc/prophet/mainnet-beta.

services:
  resolver-registry:
    build:
      context: ../../..
      dockerfile: apps/oracle-attester/Dockerfile
    command: uvicorn src.resolver_registry_main:app --host 0.0.0.0 --port 8200
    env_file:
      - ./resolver-registry.env
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/resolver_store:/app/resolver_store
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/audit:/app/audit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  remote-signer:
    build:
      context: ../../..
      dockerfile: apps/oracle-attester/Dockerfile
    command: uvicorn src.remote_signer_main:app --host 0.0.0.0 --port 8100
    env_file:
      - ./remote-signer.env
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/audit:/app/audit
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/signer_allowlist.txt:/app/signer_allowlist.txt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  oracle-attester:
    build:
      context: ../../..
      dockerfile: apps/oracle-attester/Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./oracle-attester.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - resolver-registry
      - remote-signer
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/proof_store:/app/proof_store
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/audit:/app/audit
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/oracle-keypair.json:/app/oracle-keypair.json:ro
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/relayer-keypair.json:/app/relayer-keypair.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  matching-keeper:
    build:
      context: ../../..
      dockerfile: apps/matching-keeper/Dockerfile
    env_file:
      - ./matching-keeper.env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ${PROPHET_RUNTIME_ROOT:-/var/lib/prophet/mainnet-beta}/matching-keeper:/app/apps/matching-keeper/state
      - ${PROPHET_SECRET_ROOT:-/etc/prophet/mainnet-beta}/keeper-id.json:/app/keeper-id.json:ro
    restart: unless-stopped

